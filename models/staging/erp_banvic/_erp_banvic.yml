
sources:
  - name: erp
    description: Este é o sistema erp da Banvic com dados de clientes, colaboradores, contas e transações
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado
      
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic
      - name: colaboradores
        description: Tabela fonte de localidades com informações pessoais de colaboradores
      
      - name: agencias
        description: Tabela fonte de clientes com informações de cada agência
